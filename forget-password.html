<body class="body-login overflow-hidden">

            <div class="form p-4 border-radius-3xl">
                <img src="assets/img/02.jpg" alt="Logo" title="Logo" class="verification-logo">

<script>
    $(document).ready(function() {
        var $input = $(".form-control"); // یا input مشخص‌تر
        $input.on("input", function() {
            var val = $(this).val();
            // اگر اولین کاراکتر انگلیسی باشد، LTR، در غیر این صورت RTL
            if (val.length > 0 && /^[A-Za-z0-9]/.test(val)) {
                $(this).css("direction", "ltr");
            } else {
                $(this).css("direction", "rtl");
            }
        });
        // وقتی input خالی شد، دوباره RTL شود
        $input.on("blur", function() {
            if ($(this).val() === "") {
                $(this).css("direction", "rtl");
            }
        });
    });
</script>
